<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Care Agent — Patient Terminal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f5f5; color: #222; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    h2 { margin-bottom: 10px; font-size: 1.8rem; color: #1a1a1a; }
    .subtitle { color: #666; margin-bottom: 20px; font-size: 0.95rem; }
    .camera-box { width: 100%; max-width: 480px; height: 360px; background: #000; border: 3px solid #ddd; border-radius: 12px; margin: 0 auto 20px; position: relative; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .info-box { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 20px; font-size: 0.95rem; color: #555; }
    .gestures { font-weight: 600; color: #333; margin-bottom: 5px; }
    .gesture-key { display: inline-block; background: #f0f0f0; padding: 4px 8px; border-radius: 4px; margin: 3px; font-size: 0.9rem; }
    .btn { padding: 14px 20px; font-size: 1rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; margin: 5px; transition: all 0.2s; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; box-shadow: 0 2px 6px rgba(37,99,235,0.3); }
    .btn-primary:disabled { background: #cbd5e1; cursor: not-allowed; }
    .btn-stop { background: #dc2626; color: white; display: none; margin-top: 20px; font-size: 1.1rem; padding: 16px 32px; }
    .btn-stop:hover { background: #b91c1c; }
    #log { font-family: "Monaco", "Courier New", monospace; color: #0066cc; background: #f9f9f9; border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-top: 20px; font-size: 0.85rem; max-height: 200px; overflow-y: auto; text-align: left; line-height: 1.4; }
    .status { font-size: 1rem; margin-top: 12px; color: #d97706; font-weight: 600; }
    .status-ok { color: #059669; }
    .status-error { color: #dc2626; }
    .button-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>🛡️ Care Guardian Edge</h2>
    <p class="subtitle">Elderly patient monitoring with gesture recognition</p>

    <div class="camera-box"><video id="videoFeed" autoplay playsinline muted></video></div>

    <div class="info-box">
      <div class="gestures">Gesture codes:</div>
      <span class="gesture-key">1 finger = Water</span>
      <span class="gesture-key">2 fingers = Food</span>
      <span class="gesture-key">3 fingers = Toilet</span>
      <span class="gesture-key">Fist = Emergency</span>
    </div>

    <div class="status" id="statusBox"></div>

    <div class="button-group">
      <button class="btn btn-primary" id="startBtn" onclick="initSystem()">Initialize Agent</button>
      <button class="btn btn-primary" id="stopBtn" onclick="stopSystem()" style="display: none;">Stop Agent</button>
    </div>

    <!-- STOP SIGNAL — only visible when speaker is active -->
    <button class="btn btn-stop" id="speakerStopBtn" onclick="stopSpeaker()">🔕 STOP ALERT SIGNAL</button>

    <div id="log">Waiting to start...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>

  <script>
    const video = document.getElementById('videoFeed');
    const logBox = document.getElementById('log');
    const statusBox = document.getElementById('statusBox');
    const speakerStopBtn = document.getElementById('speakerStopBtn');
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    let isLocked = false;
    let watchdogInterval = null;
    let activeStream = null;
    let activeCamera = null;
    let speakerLoop = null;



    function log(msg) {
      logBox.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}<br>` + logBox.innerHTML;
    }

    function setStatus(msg) {
      statusBox.textContent = msg;
      statusBox.className = "status";
      if (msg.includes("Running") || msg.includes("Ready")) {
        statusBox.classList.add("status-ok");
      } else if (msg.includes("Error") || msg.includes("STOP")) {
        statusBox.classList.add("status-error");
      }
    }

    function speak(phrase) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(new SpeechSynthesisUtterance(phrase));
    }

    async function initSystem() {
      try {
        const u = new SpeechSynthesisUtterance(" ");
        u.volume = 0;
        window.speechSynthesis.speak(u);
      } catch (e) {}

      document.getElementById('startBtn').style.display = "none";
      document.getElementById('stopBtn').style.display = "inline-block";
      setStatus("Starting camera...");
      log("Starting camera...");

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, facingMode: "user" }
        });
        activeStream = stream;
        video.srcObject = stream;

        await new Promise(resolve => {
          if (video.videoWidth > 0) return resolve();
          video.onloadedmetadata = () => resolve();
        });

        log("Camera ready. Initialising MediaPipe...");
        await initMediaPipe();
        setStatus("✓ Running. Show gestures to the camera.");

        watchdogInterval = setInterval(() => {
          if (!isLocked) dispatchEvent("NONE");
        }, 8000);
      } catch (e) {
        log("❌ Camera Error: " + e.message);
        setStatus("Camera access denied.");
      }
    }

    function stopSystem() {
      if (watchdogInterval) clearInterval(watchdogInterval);
      if (speakerLoop) { clearInterval(speakerLoop); speakerLoop = null; }
      if (activeCamera) activeCamera.stop();
      if (activeStream) activeStream.getTracks().forEach(t => t.stop());
      video.srcObject = null;
      window.speechSynthesis.cancel();
      isLocked = false;
      speakerStopBtn.style.display = "none";
      document.getElementById('startBtn').style.display = "inline-block";
      document.getElementById('stopBtn').style.display = "none";
      setStatus("");
      log("🛑 Agent stopped.");
    }

    // ---------- SPEAKER LOOP ----------
    function startSpeakerLoop(phrase) {
      if (speakerLoop) return;
      log(`🔊 Speaker ON — repeating every 20s: "${phrase}"`);
      setStatus("🚨 Alert active — press STOP when help arrives");
      speakerStopBtn.style.display = "inline-block";

      const tick = async () => {
        try {
          const r = await fetch("/api/v1/patient-loop");
          const d = await r.json();
          if (d.speak) {
            speak(phrase);
            log(`🔊 "${phrase}"`);
          } else {
            log("🔕 Speaker stopped by patient.");
            setStatus("");
            speakerStopBtn.style.display = "none";
            if (speakerLoop) { clearInterval(speakerLoop); speakerLoop = null; }
          }
        } catch (e) {}
      };

      tick();
      speakerLoop = setInterval(tick, 20000);
    }

    async function stopSpeaker() {
      try {
        await fetch("/api/v1/stop-speaker", { method: "POST" });
      } catch (e) {}
      if (speakerLoop) { clearInterval(speakerLoop); speakerLoop = null; }
      window.speechSynthesis.cancel();
      speakerStopBtn.style.display = "none";
      setStatus("");
      log("🔕 STOP pressed. Signal silenced.");
    }

    async function dispatchEvent(gestureName) {
      if (!video.videoWidth) return;
      canvas.width = 480; canvas.height = 360;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const b64 = canvas.toDataURL("image/jpeg", 0.7);

      try {
        const res = await fetch("/api/v1/process-frame", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ gesture: gestureName, snapshot: b64 })
        });
        const data = await res.json();

        if (data.locked) {
          log(`⏸ Server paused — ${data.remaining}s left.`);
          return;
        }

        log(`Agent: ${data.assessment}`);

        if (data.spoken_code && data.spoken_code !== "NONE") {
          speak(data.spoken_code);
          startSpeakerLoop(data.spoken_code);
        }
      } catch (err) {
        log("❌ API Error");
      }
    }

    // ===================== MEDIAPIPE =====================
    async function initMediaPipe() {
      const hands = new Hands({
        locateFile: (file) =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5,
      });

      let stable = null;
      let count = 0;

      hands.onResults((results) => {
        if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
          count = 0;
          return;
        }

        const lm = results.multiHandLandmarks[0];
        let fingers = 0;

        if (lm[8].y  < lm[6].y)  fingers++;
        if (lm[12].y < lm[10].y) fingers++;
        if (lm[16].y < lm[14].y) fingers++;
        if (lm[20].y < lm[18].y) fingers++;

        let gesture = (fingers === 0) ? "FIST"
                    : (fingers === 1) ? "WATER"
                    : (fingers === 2) ? "FOOD"
                    : (fingers === 3) ? "TOILET"
                    : "NONE";

        if (gesture !== "NONE") {
          if (stable === gesture) {
            count++;
          } else {
            stable = gesture;
            count = 1;
          }
          if (count === 5 && !isLocked) {
            isLocked = true;
            log(`🎯 Detected: ${gesture}`);
            dispatchEvent(gesture);
            setTimeout(() => { isLocked = false; count = 0; }, 5000);
          }
        } else {
          count = 0;
        }
      });

      try {
        await hands.initialize();
        log("✅ MediaPipe Hands ready.");
      } catch (e) {
        log("❌ MediaPipe init failed: " + e);
        return;
      }

      activeCamera = new Camera(video, {
        onFrame: async () => {
          if (video.videoWidth === 0 || video.videoHeight === 0) return;
          try { await hands.send({ image: video }); } catch (e) {}
        },
        width: 640,
        height: 480
      });
      activeCamera.start();
      log("📷 Camera loop started.");
    }
  </script>
</body>
</html>
