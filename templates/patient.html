<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Care Agent — Patient Terminal</title>
  <style>
    body { background: #0f172a; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
    .camera-box { width: 100%; max-width: 480px; height: 360px; background: #000; border: 3px solid #334155; border-radius: 12px; margin: 0 auto 20px; position: relative; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .btn { padding: 16px 24px; font-size: 1.2rem; font-weight: bold; background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer; margin: 5px; }
    .btn-danger { background: #ef4444; }
    #log { font-family: monospace; color: #38bdf8; margin-top: 20px; font-size: 0.9rem; }
    .dash-link { display: inline-block; margin-bottom: 15px; color: #38bdf8; text-decoration: none; font-weight: bold; }
    .dash-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h2>🛡️ Care Guardian Edge</h2>
  <a href="/dashboard" class="dash-link" target="_blank">↗ Open Caregiver Dashboard</a>

  <div class="camera-box"><video id="videoFeed" autoplay playsinline muted></video></div>
  <p>Gestures: 1=Water | 2=Food | 3=Toilet | Fist=EMERGENCY</p>

  <button class="btn" id="startBtn" onclick="initSystem()">Initialize Agent</button>
  <button class="btn btn-danger" id="stopBtn" onclick="stopSystem()" style="display: none;">Stop Agent</button>

  <div id="log">Waiting to start...</div>
  <audio id="comfortAudio" loop></audio>

  <!-- Version-pinned CDN links -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>

  <script>
    const video = document.getElementById('videoFeed');
    const logBox = document.getElementById('log');
    const comfortAudio = document.getElementById('comfortAudio');
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    let isLocked = false;
    let watchdogInterval = null;
    let activeStream = null;
    let activeCamera = null;
    let speakerLoop = null;   // <-- 20s repeating speaker interval

    const VOCAB = {
      "CONFIRM_WATER": "Noted. Your family has been alerted for water.",
      "CONFIRM_FOOD": "Noted. Your family has been alerted for food.",
      "CONFIRM_TOILET": "Noted. Assistance for the toilet is requested.",
      "EMERGENCY_DISPATCHED": "Emergency detected. I am calling your family right now.",
      "COMFORT_WAITING": "Help is on the way. Just breathe."
    };

    function log(msg) { logBox.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}<br>` + logBox.innerHTML; }

    function speak(phrase) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(new SpeechSynthesisUtterance(phrase));
    }

    function initSystem() {
      speak("");
      document.getElementById('startBtn').style.display = "none";
      document.getElementById('stopBtn').style.display = "inline-block";
      log("Starting camera...");

      navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" } })
        .then(stream => {
          activeStream = stream;
          video.srcObject = stream;
          initMediaPipe();
          watchdogInterval = setInterval(() => { if(!isLocked) dispatchEvent("NONE"); }, 8000);
        }).catch(e => log("Camera Error: " + e.message));
    }

    function stopSystem() {
      // 1. Stop background ping
      if (watchdogInterval) clearInterval(watchdogInterval);

      // 2. Stop the emergency speaker loop
      if (speakerLoop) { clearInterval(speakerLoop); speakerLoop = null; }

      // 3. Stop MediaPipe camera loop
      if (activeCamera) activeCamera.stop();

      // 4. Kill the physical webcam feed
      if (activeStream) {
        activeStream.getTracks().forEach(track => track.stop());
      }
      video.srcObject = null;

      // 5. Halt media and UI
      comfortAudio.pause();
      comfortAudio.currentTime = 0;
      window.speechSynthesis.cancel();
      isLocked = false;

      document.getElementById('startBtn').style.display = "inline-block";
      document.getElementById('stopBtn').style.display = "none";
      log("🛑 Agent sequence stopped. Camera and watchdog offline.");
    }

    // --- SPEAKER LOOP: repeats every 20s until caregiver ACKs or 2-min window ends ---
    function startSpeakerLoop() {
      if (speakerLoop) return;
      log("🔊 Emergency speaker loop active (every 20s).");

      const tick = async () => {
        try {
          const r = await fetch("/api/v1/patient-loop");
          const d = await r.json();
          if (!d.speak) {
            log("✅ Caregiver acknowledged. Speaker loop stopped.");
            if (speakerLoop) { clearInterval(speakerLoop); speakerLoop = null; }
            return;
          }
          speak(d.phrase);
          log(`🔊 Speaker: "${d.phrase}" (${d.remaining}s left in loop)`);
        } catch (e) { /* ignore transient errors */ }
      };

      tick();                                   // speak immediately
      speakerLoop = setInterval(tick, 20000);   // then every 20 seconds
    }

    async function dispatchEvent(gestureName) {
      if (!video.videoWidth) return;
      canvas.width = 480; canvas.height = 360;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const b64 = canvas.toDataURL("image/jpeg", 0.7);

      try {
        const res = await fetch("/api/v1/process-frame", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ gesture: gestureName, snapshot: b64 })
        });
        const data = await res.json();

        log(`Agent Assessed: ${data.assessment}`);

        if (data.play_music_url) {
            comfortAudio.src = data.play_music_url;
            comfortAudio.play().catch(e => console.log("Audio block", e));
            log("🎵 Comfort Music Deployed.");
        } else {
            comfortAudio.pause();
        }

        if (VOCAB[data.spoken_code]) speak(VOCAB[data.spoken_code]);

        // Kick off the 20s repeating loop whenever an alert was actually raised
        if (data.alert_id && data.spoken_code && data.spoken_code !== "NONE") {
          startSpeakerLoop();
        }
      } catch (err) { log("API Error"); }
    }

    function initMediaPipe() {
      const hands = new Hands({
        locateFile: (file) => {
          return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`;
        }
      });

      hands.setOptions({ maxNumHands: 1, minDetectionConfidence: 0.5 });

      let stable = null;
      let count = 0;

      hands.onResults((results) => {
        if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
            count = 0;
            return;
        }

        const lm = results.multiHandLandmarks[0];
        let fingers = 0;

        if (lm[8].y < lm[6].y) fingers++;
        if (lm[12].y < lm[10].y) fingers++;
        if (lm[16].y < lm[14].y) fingers++;
        if (lm[20].y < lm[18].y) fingers++;

        let gesture = (fingers === 0) ? "FIST" : (fingers <= 3 ? (fingers === 1 ? "WATER" : (fingers === 2 ? "FOOD" : "TOILET")) : "NONE");

        if (gesture !== "NONE") {
          if (stable === gesture) {
              count++;
          } else {
              stable = gesture;
              count = 1;
          }
          if (count === 5 && !isLocked) {
            isLocked = true;
            log(`🎯 Trigger: ${gesture}`);
            dispatchEvent(gesture);
            setTimeout(() => { isLocked = false; count=0; }, 5000);
          }
        } else {
            count = 0;
        }
      });

      activeCamera = new Camera(video, { onFrame: async () => { await hands.send({ image: video }); }, width: 640, height: 480 });
      activeCamera.start();
    }
  </script>
</body>
</html>
