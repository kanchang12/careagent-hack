<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guardian Angel — Patient Terminal</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: radial-gradient(ellipse at top, #1e293b 0%, #0f172a 60%);
      color: #fff; font-family: system-ui, -apple-system, sans-serif;
      text-align: center; margin: 0; padding: 20px; min-height: 100vh;
    }
    h1 { margin: 0 0 10px; font-size: 1.8rem; }
    h1 .angel { filter: drop-shadow(0 0 12px #38bdf8); }
    .subtitle { color: #94a3b8; margin-bottom: 25px; font-size: 0.9rem; }
    .top-links a {
      display: inline-block; margin: 0 8px 15px; color: #38bdf8;
      text-decoration: none; font-weight: 600; font-size: 0.9rem;
      padding: 6px 14px; border: 1px solid #334155; border-radius: 6px;
      transition: all 0.2s;
    }
    .top-links a:hover { background: #1e293b; border-color: #38bdf8; }

    .camera-box {
      width: 100%; max-width: 560px; height: 420px; background: #000;
      border: 3px solid #334155; border-radius: 16px; margin: 0 auto 20px;
      position: relative; overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .camera-box.live { border-color: #16a34a; box-shadow: 0 0 30px rgba(22,163,74,0.4); }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

    .gesture-hint { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
    .gesture-hint div {
      background: #1e293b; padding: 8px 14px; border-radius: 8px;
      font-size: 0.85rem; border: 1px solid #334155;
    }
    .gesture-hint div.emergency { border-color: #dc2626; background: #450a0a; }

    .btn {
      padding: 14px 28px; font-size: 1.05rem; font-weight: 700;
      background: #2563eb; color: #fff; border: none; border-radius: 10px;
      cursor: pointer; margin: 4px; transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(37,99,235,0.3);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37,99,235,0.5); }
    .btn:active { transform: translateY(0); }
    .btn.green { background: #16a34a; box-shadow: 0 4px 12px rgba(22,163,74,0.3); }
    .btn.red { background: #dc2626; box-shadow: 0 4px 12px rgba(220,38,38,0.3); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .test-label {
      color: #94a3b8; font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 1px; margin: 20px 0 8px;
    }

    #log {
      font-family: 'SF Mono', Consolas, monospace; color: #38bdf8;
      margin-top: 20px; font-size: 0.82rem; text-align: left;
      max-width: 640px; margin: 20px auto 0; background: #0a0f1a;
      padding: 16px; border-radius: 12px; border: 1px solid #1e293b;
      max-height: 240px; overflow-y: auto; line-height: 1.6;
    }
    #log .ts { color: #64748b; }
    #log .highlight { color: #fbbf24; font-weight: 600; }
    #log .success { color: #4ade80; }
    #log .danger { color: #f87171; font-weight: 600; }

    #debugState {
      font-family: monospace; color: #fbbf24; font-size: 0.78rem;
      margin-top: 12px; background: #1e293b; padding: 10px;
      border-radius: 8px; max-width: 640px; margin: 12px auto;
      word-break: break-all;
    }

    .pulse { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

    .status-badge {
      display: inline-block; padding: 4px 12px; border-radius: 20px;
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px;
    }
    .status-badge.idle { background: #475569; }
    .status-badge.live { background: #16a34a; box-shadow: 0 0 20px rgba(22,163,74,0.6); }
    .status-badge.emergency { background: #dc2626; box-shadow: 0 0 20px rgba(220,38,38,0.6); animation: pulse 1s infinite; }
  </style>
</head>
<body>

  <h1><span class="angel">🛡️</span> Guardian Angel</h1>
  <p class="subtitle">Autonomous Elderly Care Companion — Patient Terminal</p>

  <div class="top-links">
    <a href="/dashboard" target="_blank">📊 Caregiver Dashboard</a>
    <a href="/api/v1/debug" target="_blank">🔧 Diagnostics</a>
  </div>

  <div class="camera-box" id="cameraBox">
    <video id="videoFeed" autoplay playsinline muted></video>
  </div>

  <div><span class="status-badge idle" id="statusBadge">IDLE</span></div>

  <div class="gesture-hint">
    <div>☝️ 1 finger → Water</div>
    <div>✌️ 2 fingers → Food</div>
    <div>🤟 3 fingers → Toilet</div>
    <div class="emergency">✊ Fist → EMERGENCY</div>
  </div>

  <button class="btn" id="startBtn" onclick="initSystem()">▶ Initialize Guardian</button>

  <div class="test-label">— Manual Demo Triggers —</div>
  <div>
    <button class="btn green" onclick="manualTrigger('WATER')">💧 Water</button>
    <button class="btn green" onclick="manualTrigger('FOOD')">🍽 Food</button>
    <button class="btn green" onclick="manualTrigger('TOILET')">🚻 Toilet</button>
    <button class="btn red" onclick="manualTrigger('FIST')">🚨 Emergency</button>
  </div>

  <div id="log">[system] Awaiting initialization...</div>
  <div id="debugState"></div>

  <audio id="comfortAudio" loop playsinline></audio>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>

  <script>
    const video = document.getElementById('videoFeed');
    const logBox = document.getElementById('log');
    const debugBox = document.getElementById('debugState');
    const comfortAudio = document.getElementById('comfortAudio');
    const statusBadge = document.getElementById('statusBadge');
    const cameraBox = document.getElementById('cameraBox');
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    let isLocked = false;
    let lastAssessment = '';

    const VOCAB = {
      "CONFIRM_WATER": "Noted. Your family has been alerted for water.",
      "CONFIRM_FOOD": "Noted. Your family has been alerted for food.",
      "CONFIRM_TOILET": "Noted. Assistance for the toilet is requested.",
      "EMERGENCY_DISPATCHED": "Emergency detected. I am calling your family right now.",
      "COMFORT_WAITING": "Help is on the way. Just breathe."
    };

    function log(msg, cls = '') {
      const ts = new Date().toLocaleTimeString();
      logBox.innerHTML = `<div><span class="ts">[${ts}]</span> <span class="${cls}">${msg}</span></div>` + logBox.innerHTML;
    }

    function setStatus(state) {
      statusBadge.className = 'status-badge ' + state;
      statusBadge.textContent = state.toUpperCase();
      cameraBox.classList.toggle('live', state === 'live' || state === 'emergency');
    }

    function speak(phrase) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(phrase);
      u.rate = 1.0; u.pitch = 1.0;
      window.speechSynthesis.speak(u);
    }

    function initSystem() {
      // Unlock audio with silent WAV
      comfortAudio.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
      comfortAudio.play().catch(() => {});

      speak(" ");
      document.getElementById('startBtn').disabled = true;
      log("Starting camera...");
      setStatus('idle');

      navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" } })
        .then(stream => {
          video.srcObject = stream;
          setStatus('live');
          log("Camera live ✅", 'success');
          initMediaPipe();
          setInterval(() => { if (!isLocked) dispatchEvent("NONE", true); }, 10000);
        })
        .catch(e => {
          log("Camera Error: " + e.message, 'danger');
          setStatus('idle');
          document.getElementById('startBtn').disabled = false;
        });
    }

    function manualTrigger(gesture) {
      log(`🧪 Manual trigger: ${gesture}`, 'highlight');
      dispatchEvent(gesture, false);
    }

    async function dispatchEvent(gestureName, isWatchdog = false) {
      if (!video.videoWidth) {
        log("No video yet — click Initialize first.", 'danger');
        return;
      }
      canvas.width = 480; canvas.height = 360;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const b64 = canvas.toDataURL("image/jpeg", 0.7);

      try {
        const res = await fetch("/api/v1/process-frame", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ gesture: gestureName, snapshot: b64 })
        });
        const data = await res.json();

        lastAssessment = data.assessment;
        log(`🤖 ${data.assessment}`);

        debugBox.textContent = `alert=${data.alert_id} status=${data.status} spoken=${data.spoken_code} music=${data.play_music_url ? 'YES' : 'no'}`;

        if (data.play_music_url) {
          comfortAudio.src = data.play_music_url;
          comfortAudio.play()
            .then(() => log("🎵 Comfort music playing", 'success'))
            .catch(e => log("⚠ Audio blocked: " + e.message, 'danger'));
        } else {
          comfortAudio.pause();
        }

        if (data.status === 'ESCALATED' && data.severity === 'critical') {
          setStatus('emergency');
          setTimeout(() => setStatus('live'), 5000);
        }

        if (VOCAB[data.spoken_code]) speak(VOCAB[data.spoken_code]);
      } catch (err) {
        log("API Error: " + err.message, 'danger');
      }
    }

    function initMediaPipe() {
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`
      });
      hands.setOptions({ maxNumHands: 1, minDetectionConfidence: 0.5 });

      let stable = null, count = 0, lastLoggedGesture = null;

      hands.onResults((results) => {
        if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
          count = 0;
          return;
        }
        const lm = results.multiHandLandmarks[0];
        let fingers = 0;
        if (lm[8].y < lm[6].y) fingers++;
        if (lm[12].y < lm[10].y) fingers++;
        if (lm[16].y < lm[14].y) fingers++;
        if (lm[20].y < lm[18].y) fingers++;

        let gesture = (fingers === 0) ? "FIST"
          : (fingers === 1) ? "WATER"
          : (fingers === 2) ? "FOOD"
          : (fingers === 3) ? "TOILET"
          : "NONE";

        if (gesture !== lastLoggedGesture) {
          log(`👁 MediaPipe: ${fingers} fingers → ${gesture}`);
          lastLoggedGesture = gesture;
        }

        if (gesture !== "NONE") {
          if (stable === gesture) count++; else { stable = gesture; count = 1; }
          if (count === 3 && !isLocked) {
            isLocked = true;
            log(`🎯 Trigger: ${gesture}`, 'highlight');
            dispatchEvent(gesture, false);
            setTimeout(() => { isLocked = false; count = 0; }, 5000);
          }
        } else {
          count = 0;
        }
      });

      const camera = new Camera(video, {
        onFrame: async () => { await hands.send({ image: video }); },
        width: 640, height: 480
      });
      camera.start();
      log("MediaPipe hand detection armed ✅", 'success');
    }
  </script>
</body>
</html>
